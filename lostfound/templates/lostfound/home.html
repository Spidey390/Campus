{% extends 'lostfound/base.html' %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 text-center">
    <h1 class="display-5 fw-bold">Welcome to Campus Lost & Found</h1>
    <p class="fs-4">The easiest way to report and find lost items.</p>
    <a class="btn btn-danger btn-lg" href="{% url 'report_item' status='Lost' %}">Report a Lost Item</a>
    <a class="btn btn-success btn-lg" href="{% url 'report_item' status='Found' %}">Report a Found Item</a>
</div>
{% endblock %}
