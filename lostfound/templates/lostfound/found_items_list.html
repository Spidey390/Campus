{% extends 'lostfound/base.html' %}
{% block content %}
<h2>Search for Found Items</h2>
<form method="get" class="mb-4">
    <input type="text" name="q" class="form-control" placeholder="Search by name or description...">
</form>
<div class="row">
    {% for item in items %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            {% if item.image %}<img src="{{ item.image.url }}" class="card-img-top"
                style="height: 200px; object-fit: cover;">{% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ item.item_name }}</h5>
                <p class="card-text">{{ item.description|truncatewords:15 }}</p>
                <a href="{% url 'item_detail' item.pk %}" class="btn btn-primary">View Details</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p>No verified found items match your search.</p>
    {% endfor %}
</div>
{% endblock %}
